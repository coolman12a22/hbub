<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Party Hub: games for friends in the same room</title>
<meta name="description" content="Digital companion for real-life party games: secret roles, timers and scoring on every phone.">
<meta name="color-scheme" content="light dark">
<style>/* Design system built on the Paper UI Kit. All paper pieces are used as backgrounds (see assets/). */
:root{--bg:#d9cdb8;--ink:#2b2118;--mut:#6f6254;--pf:brightness(1);--accent:#e8590c;--line:#2b2118;--field:#fff8ec;--shadow:0 5px 0 rgba(43,33,24,.14);
 
 
 }
:root[data-theme=dark]{--bg:#1c1712;--ink:#f3e8d6;--mut:#b6a690;--pf:brightness(.3) saturate(.8);--line:#0c0a07;--field:#2b231b;--shadow:0 6px 0 rgba(0,0,0,.35)}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0);transition:background .3s}
#app{max-width:1100px;margin:0 auto;padding:12px}main{display:grid;gap:18px;margin-top:14px}
h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:0 0 8px}h2{margin:0 0 10px;font-size:22px}h3{margin:6px 0}p{margin:6px 0}
.paper{position:relative;isolation:isolate;padding:22px 26px}.paper::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--panel) center/100% 100% no-repeat;filter:var(--pf) drop-shadow(0 5px 0 rgba(43,33,24,.2));transition:filter .3s}
.paper.top,.top.paper{padding:10px 26px}.top::before{background-image:var(--bar)}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.logo{font-size:22px;letter-spacing:.5px}.nv{display:flex;gap:6px;flex:1;flex-wrap:wrap}.nv button,.tools button{background:none;border:0;font:inherit;color:var(--ink);padding:6px 12px;cursor:pointer;border-radius:10px}.nv button.on{background:var(--tab2) center/100% 100% no-repeat;font-weight:700}.nv button:hover,.tools button:hover{text-decoration:underline}
.btn{position:relative;border:0;line-height:1.1;display:inline-flex;align-items:center;justify-content:center;gaps:0;background:var(--bm) center/100% 100% no-repeat;color:#fff;font:700 16px inherit;font-family:inherit;padding:12px 26px;min-height:50px;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.35);filter:drop-shadow(0 3px 0 rgba(0,0,0,.25));transition:transform .08s,filter .15s}
.btn.g{background-image:var(--gm)}.btn.r{background-image:var(--rm)}.btn.w{background-image:var(--wm);color:#2b2118;text-shadow:none}.btn.b{background-image:var(--bm)}.btn.sm{min-height:38px;padding:6px 16px;font-size:14px;background-image:var(--ws);color:#2b2118;text-shadow:none}.btn.sm.r{background-image:var(--rm);color:#fff}
.btn:hover{filter:drop-shadow(0 4px 0 rgba(0,0,0,.25)) brightness(1.08);transform:translateY(-1px)}.btn:active{transform:translateY(2px) scale(.98);filter:drop-shadow(0 1px 0 rgba(0,0,0,.25)) brightness(.92)}.btn:disabled{filter:grayscale(.8) opacity(.6);cursor:not-allowed}.btn.sel{outline:3px solid var(--accent);outline-offset:-4px;border-radius:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0;width:100%}input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent)}input:focus,select:focus,textarea:focus{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.row>input{flex:1;min-width:140px}.col{display:grid;gap:8px}
.mut{color:var(--mut);font-size:14px}.big{font-size:1.5em;font-weight:700}.empty{color:var(--mut);text-align:center;padding:18px}.err{color:#c92a2a}
.hero{display:grid;grid-template-columns:1fr;gap:12px;padding:30px 34px}.hero p{max-width:560px}
.bar{display:grid;gap:10px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chipb{border:0;background:var(--tab) center/100% 100% no-repeat;font:inherit;color:#2b2118;padding:8px 18px;cursor:pointer;min-width:84px}.chipb.on{background-image:var(--tab2);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.gcard{display:flex;gap:14px;padding:22px;cursor:pointer;transition:transform .15s}.gcard:hover{transform:translateY(-4px) rotate(-.6deg)}.gcard:active{transform:scale(.98)}.gcard h3{margin:0 0 2px;font-size:19px}.gcard p{font-size:14px;color:var(--mut)}.meta{display:flex;gap:12px;font-size:13px;font-weight:700}
.gic{flex:none;width:58px;height:58px;border-radius:16px;border:2px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow)}.gi{width:32px;height:32px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tag{border:2px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;background:var(--field)}
.fv{position:absolute;top:12px;right:14px;width:34px;height:34px;border:0;background:var(--star) center/contain no-repeat;cursor:pointer}.fv.on{background-image:var(--star2)}.fv:hover{transform:scale(1.15) rotate(8deg)}
.lob{display:grid;gap:8px;align-content:start}main:has(.lob){grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.code{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.code b{font-size:48px;letter-spacing:8px}.qr{width:96px;height:96px;border:2px solid var(--line);border-radius:8px;background:#fff}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:8px}.plist li{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--field);border:2px solid var(--line);border-radius:14px}.plist span{flex:1}.plist em{font-style:normal;font-size:13px;color:var(--mut)}.plist em.ok{color:#2f9e44;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:#868e96}.dot.on{background:#2f9e44;box-shadow:0 0 0 3px rgba(47,158,68,.25)}
.av{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:inline-grid;place-items:center;color:#fff;font:700 15px inherit;font-style:normal;flex:none;text-shadow:0 1px 0 #0006}
.gsel{display:flex;gap:6px;flex-wrap:wrap}.gchip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--field);color:var(--ink);border-radius:12px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}.gchip .gi{width:22px;height:22px}.gchip.on{background:var(--accent);color:#fff;border-color:var(--line)}.gchip.on .gi{stroke:#fff}
.rules{background:var(--field);border:2px dashed var(--line);border-radius:14px;padding:10px 14px}.sets{display:grid;gap:10px}.sets label{display:grid;gap:4px;font-weight:700;font-size:14px}.sets label.inl{display:flex;align-items:center;justify-content:space-between}
.play{min-height:60vh}.ph{display:flex;align-items:center;gap:12px;margin-bottom:10px}.ph h2{flex:1;margin:0}.ph .gic{width:46px;height:46px;border-radius:14px}.ph .gi{width:26px;height:26px}.body{display:grid;gap:10px;justify-items:start}.body>*{max-width:100%}
.sec{background:var(--field);border:2px solid var(--line);border-radius:16px;padding:14px 18px;position:relative;box-shadow:var(--shadow)}.sec::after{content:"Only you can see this";position:absolute;top:-10px;right:12px;background:var(--accent);color:#fff;font-size:11px;padding:1px 8px;border-radius:8px;display:none}
.chip{display:inline-block;background:var(--field);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700;margin-right:6px}.tm{font-variant-numeric:tabular-nums;font-weight:700;background:var(--field);border:2px solid var(--line);border-radius:10px;padding:0 8px}.tm.low{background:#e03131;color:#fff}
.pl{display:flex;flex-wrap:wrap;gap:8px}.pl .btn{padding:8px 18px 8px 12px;display:flex;gap:8px;align-items:center;min-height:44px}.pl .btn .av{width:26px;height:26px;font-size:12px}
.lb{margin:6px 0;padding:0;list-style:none;display:grid;gap:6px;width:100%}.lb li{display:flex;align-items:center;gap:10px;background:var(--field);border:2px solid var(--line);border-radius:12px;padding:6px 12px}.lb li:first-child{background:linear-gradient(90deg,#ffe066,var(--field))}.lb span{flex:1}.lb b{font-size:20px}
.spec{display:flex;align-items:center;gap:10px;width:min(560px,100%)}.spec span{font-weight:700;font-size:14px;width:84px;text-align:center}.track{flex:1;height:26px;border-radius:14px;border:2px solid var(--line);background:linear-gradient(90deg,#4dabf7,#fff,#ff8787);position:relative}.tg,.gs{position:absolute;top:-6px;width:8px;height:34px;border-radius:4px;border:2px solid var(--line);transform:translateX(-50%)}.tg{background:#ffd43b;height:38px;top:-8px}.gs{background:#495057}.sl{width:min(560px,100%);accent-color:var(--accent)}
.hand,.pile{display:flex;gap:8px;flex-wrap:wrap;min-height:50px}.card{display:inline-grid;place-items:center;min-width:46px;height:62px;border:2px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink);font:700 20px inherit;padding:0 8px}.card.big{min-width:70px;height:96px;font-size:30px;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}button.card.big:hover{transform:translateY(-6px) rotate(-2deg)}button.card:disabled{opacity:.5;cursor:wait}.card.bad{background:#ffc9c9;color:#a61e1e}
.word{display:flex;gap:6px}.word span{width:38px;height:46px;border-bottom:4px solid var(--line);display:grid;place-items:end center;font:700 28px inherit;text-transform:uppercase}
.hist{margin:4px 0;padding-left:18px;font-size:14px;width:100%}.step{background:var(--field);border:2px solid var(--line);border-radius:14px;padding:10px 14px;width:min(420px,100%);display:grid;gap:6px}.step img,.pic{width:100%;max-width:320px;border:2px solid var(--line);border-radius:10px;background:#fff}
#cv{width:min(100%,360px);aspect-ratio:3/2;border:3px solid var(--line);border-radius:12px;touch-action:none;background:#fff;cursor:crosshair}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--bub) center/100% 100% no-repeat;color:#2b2118;padding:20px 34px 28px;z-index:20;cursor:pointer;animation:pop .25s}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:10;padding:16px;animation:fade .2s}.md{max-width:520px;width:100%;max-height:90vh;overflow:auto;background:none;animation:pop .25s}.md .gic{margin-bottom:8px}.xb{position:absolute;top:4px;right:6px;width:44px;height:40px;border:0;background:var(--x) center/contain no-repeat;cursor:pointer}
.loadbar{height:24px;background:var(--lb0) center/100% 100% no-repeat;position:relative;max-width:360px;margin:10px 0}.loadbar i{position:absolute;inset:0;background:var(--lb1) left/100% 100% no-repeat;animation:load 1.2s ease-in-out infinite alternate}
.sw{display:flex;gap:8px;flex-wrap:wrap}.swb{width:44px;height:44px;border-radius:50%;border:3px solid var(--line);color:#fff;font:700 18px inherit;cursor:pointer}.swb.on{outline:4px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpis div{background:var(--field);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}.kpis b{display:block;font-size:30px}.kpis span{font-size:13px;color:var(--mut)}.hrow{margin:2px 0;font-size:14px;border-bottom:1px dashed var(--mut);padding-bottom:4px}
label{display:grid;gap:4px;font-weight:700}
@keyframes pop{from{transform:translateX(-50%) scale(.9);opacity:0}}@keyframes fade{from{opacity:0}}@keyframes load{from{clip-path:inset(0 70% 0 0)}to{clip-path:inset(0 0 0 0)}}.md{animation-name:mdpop}@keyframes mdpop{from{transform:scale(.92);opacity:0}}
@media(max-width:620px){.paper{padding:16px 18px}.code b{font-size:36px}.grid{grid-template-columns:1fr}.top{padding:8px 16px}.logo{width:100%}.hero{padding:20px 22px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* chat zone */
#chat{position:fixed;right:12px;bottom:12px;z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 24px)}
.chatbtn{min-height:44px;padding:8px 22px}.chatbtn b{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:#e03131;color:#fff;font-size:12px;padding:0 5px;margin-left:6px;text-shadow:none}.chatbtn b[hidden]{display:none}
.chatbox{display:none;width:min(340px,calc(100vw - 24px));height:min(420px,55vh);padding:14px 16px;flex-direction:column;gap:8px;background:none;animation:slideup .2s}.chatbox.open{display:flex}.chatbox::before{background-image:var(--panel2)}
#chat.open .chatbtn{display:none}.chatbox header{display:flex;align-items:center;justify-content:space-between}.chatbox .xb{position:static;width:38px;height:34px}
#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:4px 2px}.msg{align-self:flex-start;max-width:85%;background:var(--field);border:2px solid var(--line);border-radius:14px 14px 14px 4px;padding:4px 10px;word-break:break-word;font-size:14px}.msg span{display:block;font-size:11px;font-weight:700;color:var(--mut)}.msg.me{align-self:flex-end;background:#ffe8cc;color:#2b2118;border-radius:14px 14px 4px 14px}
.crow{display:flex;gap:6px;align-items:center}.crow input{flex:1;padding:8px 10px}
@keyframes slideup{from{transform:translateY(16px);opacity:0}}
@media(min-width:1100px){body.chat-open #app{margin-right:372px}}
@media(max-width:620px){#chat{right:6px;left:6px;bottom:6px;align-items:stretch}.chatbox{width:100%;height:50vh}.chatbtn{align-self:flex-end}}

const U={rnd:a=>a[Math.random()*a.length|0],shuf(a){a=[...a];for(let i=a.length;i>1;i--){const j=Math.random()*i|0;[a[i-1],a[j]]=[a[j],a[i-1]]}return a},

<script>/* Host-authoritative engine. One client (the host) runs the game rules; everybody else only sends actions.
   Public state goes to rooms.state, private state goes to the secrets table (one row per player, protected by RLS). */
class Host{
 constructor(G,pl,cfg,sink,saved){this.G=G;this.pl=pl;this.cfg=cfg;this.sink=sink;this.last='';this.sd=false;this.hostId=sink.hostId;
  this.S=saved?saved.S:{};this.SEC=saved?saved.SEC:{};this.H=saved?saved.H:{};if(!saved){this.S.sc={};this.S.off={};this.S.pl=pl.map(p=>({id:p.id,name:p.name,av:p.av}));G.init(this)}this.commit()}
 ids(){return this.pl.map(p=>p.id)}
 on(){return this.ids().filter(i=>!this.S.off[i])}
 name(i){return(this.pl.find(p=>p.id==i)||{}).name||'?'}
 isHost(a){return a.p==this.hostId}
 sec(id,o){this.SEC[id]={...(this.SEC[id]||{}),...o};this.sd=true}
 clear(){this.SEC={};this.sd=true}
 timer(s){this.S.dl=Date.now()+s*1000}
 late(){return !!this.S.dl&&Date.now()>=this.S.dl}
 score(id,n){this.S.sc[id]=(this.S.sc[id]||0)+n}
 presence(on){let ch=false;this.ids().forEach(i=>{const off=!on.has(i);if(!!this.S.off[i]!==off){this.S.off[i]=off;ch=true}});if(ch)this.commit()}
 act(a){if(!this.ids().includes(a.p))return;if(a.t=='again'){if(this.isHost(a)){const o=this.S.off,p=this.S.pl;this.S={sc:{},off:o,pl:p};this.SEC={};this.H={};this.sd=true;this.G.init(this)}}else if(a.t=='next'){if(this.isHost(a)&&this.G.next)this.G.next(this)}else this.G.act(this,a);this.commit()}
 tick(){if(this.G.tick)this.G.tick(this);this.commit()}
 save(){return{S:this.S,SEC:this.SEC,H:this.H}}
 commit(){const j=JSON.stringify(this.S);if(j!==this.last){this.last=j;this.sink.state(this.S)}if(this.sd){this.sd=false;this.sink.secrets(this.SEC)}this.sink.persist&&this.sink.persist(this.save())}
}
/* ---------- Local backend: same-browser tabs (demo mode). NOT secure: secrets sit in localStorage. ---------- */
const LB={name:'local',uid:null,bc:typeof BroadcastChannel!='undefined'?new BroadcastChannel('pg'):null,

 mut(c,f){const d=this.rd(c);if(!d)return null;f(d);this.wr(c,d);return d},
 async createRoom(me){let c;do c=U.code();while(this.rd(c));this.wr(c,{room:{code:c,host:this.uid,game:'impostor',cfg:{},status:'lobby',state:{},wins:{},party:false},players:{[this.uid]:{id:this.uid,name:me.name,av:me.av,ready:true,seen:Date.now()}},secrets:{},acts:[]});return c},
 async join(c,me){const d=this.mut(c,d=>{d.players[this.uid]={...(d.players[this.uid]||{ready:false}),id:this.uid,name:me.name,av:me.av,seen:Date.now()}});if(!d)throw new Error('Room not found');return d.room},
 view(d){const now=Date.now();return Object.values(d.players).map(p=>({...p,on:now-p.seen<9000,host:p.id==d.room.host}))},
 sub(c,h){let lr='',lp='',ls='',la=(this.rd(c)||{acts:[]}).acts.length,lc=Math.max(0,((this.rd(c)||{}).chat||[]).length-50);const run=()=>{const d=this.rd(c);if(!d)return h.gone&&h.gone();const r=JSON.stringify(d.room);if(r!=lr){lr=r;h.room(d.room)}const p=JSON.stringify(this.view(d).map(x=>[x.id,x.name,x.av,x.ready,x.on]));if(p!=lp){lp=p;h.players(this.view(d))}
   const s=JSON.stringify(d.secrets[this.uid]||{});if(s!=ls){ls=s;h.secret(d.secrets[this.uid]||{})}if(d.room.host==this.uid&&h.action){while(la<d.acts.length)h.action(d.acts[la++])}const ch=d.chat||[];while(lc<ch.length)h.chat&&h.chat(ch[lc++])};
  const f=e=>{if(!e||e.key==null||e.key=='pg:'+c)run()},m=e=>{if(e.data==c)run()};addEventListener('storage',f);this.bc&&this.bc.addEventListener('message',m);const iv=setInterval(run,1000);run();return()=>{removeEventListener('storage',f);this.bc&&this.bc.removeEventListener('message',m);clearInterval(iv)}},
 async patch(c,p){this.mut(c,d=>Object.assign(d.room,p))},
 async setSecrets(c,map){this.mut(c,d=>{d.secrets=map})},
 async act(c,a){this.mut(c,d=>{d.acts.push(a)})},
 async ping(c,me){this.mut(c,d=>{const p=d.players[this.uid];if(p)Object.assign(p,me,{seen:Date.now()})})},
 async leave(c){this.mut(c,d=>{delete d.players[this.uid]})},
 async chat(c,m){this.mut(c,d=>{d.chat=[...(d.chat||[]),{id:Date.now()+Math.random(),p:this.uid,name:m.name,text:m.text,t:Date.now()}].slice(-200)})}};
/* ---------- Supabase backend (see supabase/schema.sql). Needs window.PG_CONFIG = {url, key}. ---------- */
const SB={name:'supabase',uid:null,sb:null,
 async ready(){const cf=window.PG_CONFIG||{};if(!cf.url||!window.supabase)throw new Error('Supabase is not configured');this.sb=window.supabase.createClient(cf.url,cf.key);let r=await this.sb.auth.getSession();if(!r.data.session){const s=await this.sb.auth.signInAnonymously();if(s.error)throw s.error}this.uid=(await this.sb.auth.getUser()).data.user.id},
 async createRoom(me){const r=await this.sb.rpc('create_room',{p_name:me.name,p_av:me.av});if(r.error)throw r.error;return r.data},
 async join(c,me){const r=await this.sb.rpc('join_room',{p_code:c,p_name:me.name,p_av:me.av});if(r.error)throw r.error;return r.data},
 view(rows,host){const now=Date.now();return rows.map(p=>({id:p.id,name:p.name,av:p.av,ready:p.ready,on:now-new Date(p.seen).getTime()<25000,host:p.id==host}))},
 sub(c,h){let host=null,rows=[],lastS=null,seenA=new Set(),maxA=0;const q=(t)=>this.sb.from(t),ps=()=>q('secrets').select('data').eq('room',c).eq('player',this.uid).maybeSingle().then(s=>{if(s.error)return;const d=(s.data&&s.data.data)||{},j=JSON.stringify(d);if(j!==lastS){lastS=j;h.secret(d)}}),fire=r=>{if(seenA.has(r.id))return;seenA.add(r.id);maxA=Math.max(maxA,r.id);h.action&&h.action(r.data)},pa=()=>q('actions').select('id,data').eq('room',c).gt('id',maxA).order('id').then(r=>(r.data||[]).forEach(fire)),pull=async()=>{const[r,p,s]=await Promise.all([q('rooms').select('*').eq('code',c).single(),q('players').select('*').eq('room',c),q('secrets').select('data').eq('room',c).eq('player',this.uid).maybeSingle()]);if(r.data){host=r.data.host;h.room(r.data)}else return h.gone&&h.gone();rows=p.data||[];h.players(this.view(rows,host));{const d=(s.data&&s.data.data)||{};lastS=JSON.stringify(d);h.secret(d)}};
  pull();q('actions').select('id').eq('room',c).then(r=>(r.data||[]).forEach(x=>{seenA.add(x.id);maxA=Math.max(maxA,x.id)}));const cm=m=>({id:m.id,p:m.player,name:m.name,text:m.text,t:new Date(m.created_at).getTime()});q('messages').select('*').eq('room',c).order('id',{ascending:false}).limit(50).then(r=>(r.data||[]).reverse().forEach(m=>h.chat&&h.chat(cm(m))));const ch=this.sb.channel('room:'+c).on('postgres_changes',{event:'*',schema:'public',table:'rooms',filter:'code=eq.'+c},e=>{if(e.eventType=='DELETE')return h.gone&&h.gone();host=e.new.host;h.room(e.new);ps()})
   .on('postgres_changes',{event:'*',schema:'public',table:'players',filter:'room=eq.'+c},()=>q('players').select('*').eq('room',c).then(p=>{rows=p.data||[];h.players(this.view(rows,host))}))
   .on('postgres_changes',{event:'*',schema:'public',table:'secrets',filter:'room=eq.'+c},e=>{if(e.new&&e.new.player==this.uid){lastS=JSON.stringify(e.new.data||{});h.secret(e.new.data||{})}})
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'actions',filter:'room=eq.'+c},e=>fire(e.new))
   .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room=eq.'+c},e=>{h.chat&&h.chat(cm(e.new))}).subscribe();
  const iv=setInterval(()=>q('players').select('*').eq('room',c).then(p=>{rows=p.data||[];h.players(this.view(rows,host))}),10000),iv2=setInterval(()=>{ps();pa()},3000);return()=>{this.sb.removeChannel(ch);clearInterval(iv);clearInterval(iv2)}},
 async patch(c,p){const r=await this.sb.from('rooms').update(p).eq('code',c);if(r.error){console.error(r.error);A.err='Could not update the room ('+r.error.message+')';render()}},
 async setSecrets(c,map){this._sq=(this._sq||Promise.resolve()).then(async()=>{const rows=Object.entries(map).map(([player,data])=>({room:c,player,data}));if(!rows.length)return;const r=await this.sb.from('secrets').upsert(rows,{onConflict:'room,player'});if(r.error){console.error(r.error);A.err='Could not send private info to players ('+r.error.message+'). Run party-hub-fix.sql in Supabase.';render()}}).catch(()=>{});return this._sq},
 async act(c,a){const r=await this.sb.from('actions').insert({room:c,player:this.uid,data:a});if(r.error){console.error(r.error);A.err='Could not send your move ('+r.error.message+')';render()}},
 async ping(c,me){await this.sb.from('players').update({...me,seen:new Date().toISOString()}).eq('room',c).eq('id',this.uid)},
 async leave(c){await this.sb.from('players').delete().eq('room',c).eq('id',this.uid)},

<script>/* Each game: init/act/tick/next run ONLY on the host; view() runs on every client with c = {S: public state, me: this player's private data, pid, host, ...}. */
const AVC=['#e8590c','#1c7ed6','#2f9e44','#ae3ec9','#f08c00','#0ca678','#d6336c','#4263eb','#e03131','#5c940d','#1098ad','#7048e8'];
const av=(c,i)=>{const p=c.pl.find(x=>x.id==i)||{};return`<i class=av style="background:${AVC[(p.av||0)%AVC.length]}">${U.esc((p.name||'?')[0].toUpperCase())}</i>`};
const h={
 b:(t,a,d={},cls='')=>`<button class="btn ${cls}" data-a="${a}"${Object.entries(d).map(([k,v])=>` data-${k}="${U.esc(v)}"`).join('')}>${t}</button>`,
 inp:(id,ph,a,bt,d={})=>`<div class=row><input id="${id}" placeholder="${U.esc(ph)}" maxlength=80 autocomplete=off data-enter="${a}">${h.b(bt,a,{in:id,...d},'g')}</div>`,
 nm:(c,i)=>U.esc(c.name(i)),tm:S=>S.dl?`<span class=tm data-dl="${S.dl}"></span>`:'',
 pick:(c,ids,a,sel,ex={})=>`<div class=pl>${ids.map(i=>h.b(av(c,i)+h.nm(c,i),a,{v:i,...ex},sel==i?'sel w':'w')).join('')}</div>`,
 box:t=>`<div class=sec>${t}</div>`,
 wait:(c,done)=>{const w=c.on().filter(i=>!done[i]);return w.length?`<p class=mut>Waiting for ${w.map(i=>h.nm(c,i)).join(', ')}</p>`:''},
 board:c=>`<ol class=lb>${[...c.ids()].sort((a,b)=>(c.S.sc[b]||0)-(c.S.sc[a]||0)).map(i=>`<li>${av(c,i)}<span>${h.nm(c,i)}</span><b>${c.S.sc[i]||0}</b></li>`).join('')}</ol>`,
 final:c=>`<h3>Final scores</h3>${h.board(c)}${c.host?`<div class=row>${h.b('Play again','again','','g')}${h.b('Back to lobby','lobby','','w')}</div>`:'<p class=mut>Waiting for the host…</p>'}`,
 nxt:(c,t='Next')=>c.host?h.b(t,'next','','g'):'<p class=mut>Waiting for the host…</p>',
 round:(c)=>`<div class=chip>Round ${c.S.round}/${c.cfg.rounds}</div>`};
const RS={k:'rounds',l:'Rounds',t:'num',d:3,min:1,max:10};
const cat=()=>({k:'cat',l:'Word list',t:'sel',o:[...Object.keys(WORDS),'Custom'],d:'Animals'});
const cnt=(c)=>c.on().length;
/* ---------------- 1. Impostor ---------------- */
PG.reg({id:'impostor',name:'Impostor',min:3,max:12,time:'10 min',cat:['Social deduction','Word'],desc:'Everyone gets the secret word except the impostor. Talk, bluff and vote.',
 rules:'Everyone sees the secret word except the impostor, who only sees the category.\nTake turns saying one clue about the word out loud.\nVote for who you think the impostor is.\nA caught impostor can still win by guessing the word.',
 st:[{k:'time',l:'Discussion (seconds)',t:'num',d:150,min:30,max:600},cat(),{...RS,d:3}],
 init(c){c.S.round=0;this.nr(c)},
 nr(c){const S=c.S,ids=c.ids(),imps=U.shuf(ids).slice(0,ids.length>=8?2:1),word=wordFor(c);S.round++;S.ph='talk';S.votes={};S.res=null;S.top=null;S.cat=c.cfg.cat;c.H={imps,word};c.clear();ids.forEach(i=>c.sec(i,imps.includes(i)?{role:'imp'}:{role:'crew',word}));c.timer(c.cfg.time)},
 next(c){c.S.ph=='res'&&(c.S.round>=c.cfg.rounds?c.S.ph='end':this.nr(c))},
 tally(c){const S=c.S,t=U.tally(S.votes).top,caught=t&&c.H.imps.includes(t);S.top=t;S.dl=0;if(caught&&c.H.imps.length==1){S.ph='guess';return}S.ph='res';S.res={word:c.H.word,imps:c.H.imps,top:t,caught:!!caught};if(caught){c.ids().forEach(i=>!c.H.imps.includes(i)&&c.score(i,1))}else c.H.imps.forEach(i=>c.score(i,2))},
 act(c,a){const S=c.S,H=c.H;
  if(a.t=='go'&&c.isHost(a)&&S.ph=='talk'){S.ph='vote';S.votes={};c.timer(60)}
  else if(a.t=='vote'&&S.ph=='vote'&&c.ids().includes(a.v)){S.votes[a.p]=a.v;if(c.on().every(i=>S.votes[i]))this.tally(c)}
  else if(a.t=='guess'&&S.ph=='guess'&&a.p==S.top){const ok=U.n(a.v)==U.n(H.word);S.ph='res';S.res={word:H.word,imps:H.imps,top:S.top,caught:true,g:a.v,ok};if(ok)H.imps.forEach(i=>c.score(i,3));else c.ids().forEach(i=>!H.imps.includes(i)&&c.score(i,1))}},
 tick(c){const S=c.S;if(c.late()){if(S.ph=='talk'){S.ph='vote';S.votes={};c.timer(60)}else if(S.ph=='vote')this.tally(c)}},
 view(c){const S=c.S,m=c.me;if(S.ph=='end')return h.final(c);let t=h.round(c);
  if(S.ph=='talk')t+=h.box(m.role=='imp'?`You are the <b>impostor</b>. Category: ${U.esc(S.cat)}`:`Secret word: <b class=big>${U.esc(m.word)}</b>`)+`<p>Say one clue each, out loud. ${h.tm(S)}</p>`+(c.host?h.b('Start voting','go','','g'):'');
  else if(S.ph=='vote')t+=`<p>Who is the impostor? ${h.tm(S)}</p>${h.pick(c,c.ids(),'vote',S.votes[c.pid])}${h.wait(c,S.votes)}`;
  else if(S.ph=='guess')t+=S.top==c.pid?`<p><b>You were caught!</b> Guess the word to win.</p>${h.inp('g','Your guess','guess','Guess')}`:`<p>${h.nm(c,S.top)} was caught and is guessing the word…</p>`;
  else{const r=S.res;t+=`<h3>${r.caught?(r.ok?'Caught, but guessed the word!':'Impostor caught'):'The impostor got away'}</h3><p>Impostor: <b>${r.imps.map(i=>h.nm(c,i)).join(' and ')}</b>. Word: <b>${U.esc(r.word)}</b>${r.g?` (guess: ${U.esc(r.g)})`:''}</p>${h.board(c)}${h.nxt(c,S.round>=c.cfg.rounds?'Final scores':'Next round')}`}
  return t}});
/* ---------------- 2. Undercover ---------------- */
PG.reg({id:'undercover',name:'Undercover',min:3,max:12,time:'15 min',cat:['Social deduction','Word'],desc:'Similar words, one slight difference. Find the undercover agent.',
 rules:'Most players get the same word; the undercover gets a similar one (Mr White gets none).\nTake turns giving a one-word clue.\nVote someone out. Civilians win when every outsider is gone; outsiders win when they equal the civilians.\nMr White can steal the win by guessing the civilian word.',
 st:[{k:'white',l:'Include Mr White (6+ players)',t:'bool',d:true},{...RS,d:2}],
 init(c){c.S.round=0;this.nr(c)},
 nr(c){const S=c.S,ids=U.shuf(c.ids()),n=ids.length,p=U.shuf(U.rnd(PAIRS)),nu=n>=8?2:1,nw=c.cfg.white&&n>=6?1:0,roles={};ids.forEach((i,k)=>roles[i]=k<nu?'und':k<nu+nw?'white':'civ');c.H={roles,civ:p[0],und:p[1]};S.round++;c.clear();ids.forEach(i=>c.sec(i,{role:roles[i]=='white'?'white':'x',word:roles[i]=='civ'?p[0]:roles[i]=='und'?p[1]:null}));S.alive=[...ids];S.out=[];S.clues=[];S.res=null;S.cyc=0;this.cl(c)},
 cl(c){const S=c.S;S.ph='clue';S.order=U.shuf(S.alive);S.ci=0;S.cyc++;S.votes={}},
 next(c){c.S.ph=='res'&&(c.S.round>=c.cfg.rounds?c.S.ph='end':this.nr(c))},

 view(c){const S=c.S,m=c.me;if(S.ph=='end'){return`<h3>That was the last chain</h3>${c.host?`<div class=row>${h.b('Play again','again','','g')}${h.b('Back to lobby','lobby','','w')}</div>`:''}`}
  const item=x=>x.k=='d'?`<div class=step><b>${h.nm(c,x.p)} drew</b>${x.d?`<img src="${x.d}">`:'<i>(skipped)</i>'}</div>`:`<div class=step><b>${h.nm(c,x.p)} wrote</b><span>${U.esc(x.d)}</span></div>`;
  if(S.ph=='rev')return`<div class=chip>Chain ${S.ci+1}/${S.n}</div>${S.items.map(item).join('')}${h.nxt(c,'Reveal next')}`;
  const draw=S.r%2==1;let t=`<div class=chip>Step ${S.r+1}/${S.n}</div> ${h.tm(S)}`;if(S.sub[c.pid])return t+`<p>Sent. ${h.wait(c,S.sub)}</p>`;
  if(S.r==0)return t+`<p>Write a starting phrase:</p>${h.inp('t','A funny sentence','sub','Send')}`;
  if(draw)return t+`<div class=sec>Draw: <b>${U.esc((m.prev||{}).d||'')}</b></div><canvas id=cv width=300 height=200></canvas><div class=row><button class="btn w" data-a=clr>Clear</button>${h.b('Send drawing','sub',{in:'cv'},'g')}</div>`;
  return t+`<p>What is this drawing?</p>${(m.prev||{}).d?`<img class=pic src="${m.prev.d}">`:''}${h.inp('t','Describe it','sub','Send')}`}});
/* ---------------- 13. Fishbowl ---------------- */
PG.reg({id:'fishbowl',name:'Fishbowl',min:3,max:12,time:'25 min',cat:['Team','Party'],desc:'Describe, one-word, then act. Same words, three rounds.',
 rules:'Everyone puts secret words into the bowl.\nTeams take turns: the clue-giver sees one word at a time.\nRound 1: describe freely. Round 2: one word only. Round 3: act it out silently.\nTap Got it for each correct word; the team with the most wins.',
 st:[{k:'k',l:'Words per player',t:'num',d:3,min:1,max:6},{k:'time',l:'Turn length (seconds)',t:'num',d:45,min:20,max:120}],
 init(c){const S=c.S,ids=U.shuf(c.ids());S.ph='words';S.tm={};ids.forEach((i,k)=>S.tm[i]=k%2);S.ts=[0,0];S.rd=1;S.words={};S.turn=-1;c.H={pool:[],all:[]};S.cnt={};c.clear()},
 giver(c){const S=c.S,t=S.turn%2,m=c.ids().filter(i=>S.tm[i]==t&&!S.off[i]);if(!m.length)return null;S.gi=S.gi||[0,0];return m[(S.gi[t]++)%m.length]},
 start(c){const S=c.S;S.turn++;const g=this.giver(c);S.g=g;S.ph='turn';c.H.cw=c.H.pool.shift();c.clear();c.sec(g,{w:c.H.cw});c.timer(c.cfg.time)},
 endTurn(c){const S=c.S;S.dl=0;if(c.H.cw)c.H.pool.push(c.H.cw);c.H.cw=null;c.clear();S.ph='ready'},
 next(c){const S=c.S;if(S.ph=='ready'||S.ph=='rbreak')this.start(c)},
 act(c,a){const S=c.S,H=c.H;
  if(a.t=='words'&&S.ph=='words'&&!S.words[a.p]){const w=String(a.v||'').split(/[,\n]/).map(x=>x.trim().slice(0,30)).filter(Boolean).slice(0,c.cfg.k);if(w.length<c.cfg.k)return;S.words[a.p]=1;H.all.push(...w);if(c.on().every(i=>S.words[i])){H.pool=U.shuf(H.all);S.ph='ready';S.left=H.pool.length}}
  else if(S.ph=='turn'&&a.p==S.g){if(a.t=='got'){S.ts[S.turn%2]++;H.cw=H.pool.shift();if(!H.cw){c.clear();if(S.rd>=3){S.ph='res';S.dl=0;return}S.rd++;H.pool=U.shuf(H.all);S.ph='rbreak';S.dl=0;return}c.sec(S.g,{w:H.cw})}else if(a.t=='skip'&&S.rd<3&&H.pool.length){H.pool.push(H.cw);H.cw=H.pool.shift();c.sec(S.g,{w:H.cw})}}},
 tick(c){if(c.late()&&c.S.ph=='turn')this.endTurn(c)},
 view(c){const S=c.S,m=c.me,R=['Describe it freely','One word only','Act it out, no talking'];
  if(S.ph=='res'){const w=S.ts[0]==S.ts[1]?'It is a tie':'Team '+'AB'[S.ts[1]>S.ts[0]?1:0]+' wins';return`<h3>${w}</h3><p>Team A ${S.ts[0]} \u2013 Team B ${S.ts[1]}</p>${c.host?`<div class=row>${h.b('Play again','again','','g')}${h.b('Back to lobby','lobby','','w')}</div>`:''}`}
  if(S.ph=='words')return S.words[c.pid]?`<p>Words sent. ${h.wait(c,S.words)}</p>`:`<p>Add ${c.cfg.k} secret words or names, separated by commas:</p>${h.inp('w','word one, word two, \u2026','words','Add to bowl')}`;
  let t=`<div class=chip>Round ${S.rd}/3: ${R[S.rd-1]}</div><div class=chip>A ${S.ts[0]} \u2013 B ${S.ts[1]}</div><p class=mut>You are on Team ${'AB'[S.tm[c.pid]]}</p>`;
  if(S.ph=='ready')t+=`<p>Next up: Team ${'AB'[(S.turn+1)%2]}</p>${h.nxt(c,'Start turn')}`;
  else if(S.ph=='rbreak')t+=`<p>The bowl is empty. Round ${S.rd} begins with all the words again.</p>${h.nxt(c,'Start round '+S.rd)}`;
  else t+=`<p>Clue-giver: <b>${h.nm(c,S.g)}</b> ${h.tm(S)}</p>`+(S.g==c.pid?`<div class=sec><span class=big>${U.esc(m.w||'')}</span></div><div class=row>${h.b('Got it','got','','g')}${S.rd<3?h.b('Skip','skip','','w'):''}</div>`:'<p>Guess what they are describing!</p>');
  return t}});
/* ---------------- 14. 20 Questions ---------------- */
PG.reg({id:'twenty',name:'20 Questions',min:3,max:10,time:'15 min',cat:['Deduction','Word'],desc:'Yes-or-no questions to uncover a secret.',
 rules:'The answerer secretly chooses an object, or taps random.\nEveryone else types yes/no questions; the answerer replies.\nGuess the secret before the questions run out.\nThe answerer confirms whether a guess is right.',
 st:[{k:'max',l:'Questions allowed',t:'num',d:20,min:5,max:30},cat(),{...RS,d:3}],
 init(c){c.S.round=0;this.nr(c)},
 nr(c){const S=c.S,ids=c.ids();S.a=ids[S.round%ids.length];S.round++;S.ph='pick';S.qs=[];S.asked=0;S.gs=null;S.res=null;c.H={s:null};c.clear()},
 next(c){c.S.ph=='res'&&(c.S.round>=c.cfg.rounds?c.S.ph='end':this.nr(c))},
 win(c,ok,by){const S=c.S;S.ph='res';S.res={ok,s:c.H.s,by};if(ok){c.score(by,Math.max(1,Math.ceil((c.cfg.max-S.asked)/2)+1));}else c.score(S.a,3)},
 act(c,a){const S=c.S,H=c.H;
  if(S.ph=='pick'&&a.p==S.a&&(a.t=='set'||a.t=='rand')){const s=a.t=='rand'?wordFor(c):String(a.v||'').trim().slice(0,40);if(!s)return;H.s=s;S.ph='play';c.sec(S.a,{s})}
  else if(S.ph=='play'){
   if(a.t=='ask'&&a.p!=S.a&&!S.gs&&String(a.v||'').trim()&&S.qs.filter(q=>q.a==null).length<3&&S.asked<c.cfg.max)S.qs.push({id:S.qs.length,p:a.p,q:String(a.v).trim().slice(0,100),a:null});
   else if(a.t=='ans'&&a.p==S.a){const q=S.qs[+a.id];if(q&&q.a==null){q.a=a.v=='y'?'Yes':a.v=='n'?'No':'Sometimes';S.asked++;if(S.asked>=c.cfg.max&&!S.gs)this.win(c,false)}}
   else if(a.t=='guess'&&a.p!=S.a&&!S.gs)S.gs={p:a.p,g:String(a.v||'').trim().slice(0,40)};
   else if(a.t=='verdict'&&a.p==S.a&&S.gs){const g=S.gs;S.gs=null;if(a.v=='y')this.win(c,true,g.p);else if(S.asked>=c.cfg.max)this.win(c,false)}}},
 view(c){const S=c.S,m=c.me;if(S.ph=='end')return h.final(c);let t=h.round(c)+`<div class=chip>Questions ${S.asked}/${c.cfg.max}</div><p>Answerer: <b>${h.nm(c,S.a)}</b></p>`;
  if(S.ph=='pick')t+=S.a==c.pid?`<p>Think of something, or let the game pick:</p>${h.inp('s','Your secret','set','Set')}${h.b('Pick random','rand','','w')}`:'<p>The answerer is choosing…</p>';
  else if(S.ph=='play'){if(m.s)t+=h.box(`Your secret: <b>${U.esc(m.s)}</b>`);
   t+=`<ul class=hist>${S.qs.map(q=>`<li><b>${h.nm(c,q.p)}</b>: ${U.esc(q.q)} ${q.a?`<b>\u2192 ${q.a}</b>`:S.a==c.pid?`<span class=row>${h.b('Yes','ans',{id:q.id,v:'y'},'g')}${h.b('No','ans',{id:q.id,v:'n'},'r')}${h.b('Sometimes','ans',{id:q.id,v:'m'},'w')}</span>`:'<i class=mut>waiting</i>'}</li>`).join('')||'<li class=mut>No questions yet</li>'}</ul>`;
   if(S.gs)t+=S.a==c.pid?`<div class=sec><b>${h.nm(c,S.gs.p)}</b> guesses <b>${U.esc(S.gs.g)}</b><div class=row>${h.b('Correct','verdict',{v:'y'},'g')}${h.b('Wrong','verdict',{v:'n'},'r')}</div></div>`:`<p>${h.nm(c,S.gs.p)} guessed <b>${U.esc(S.gs.g)}</b>. Waiting for the answerer…</p>`;
   else if(S.a!=c.pid)t+=`${h.inp('q','Ask a yes/no question','ask','Ask')}${h.inp('g','Or make a guess','guess','Guess')}`}
  else{const r=S.res;t+=`<h3>${r.ok?h.nm(c,r.by)+' guessed it':'Nobody guessed it'}</h3><p>The answer was <b>${U.esc(r.s)}</b></p>${h.board(c)}${h.nxt(c,S.round>=c.cfg.rounds?'Final scores':'Next round')}`}
  return t}});
</script>
<script>/* UI layer: connects the backend, runs the host engine when this device is the host, renders everything. */
const $=(s,r=document)=>r.querySelector(s),ld=(k,d)=>{try{return (localStorage[k]==null?d:JSON.parse(localStorage[k]))}catch(e){return d}},st=(k,v)=>{try{localStorage[k]=JSON.stringify(v)}catch(e){}};
const IC={impostor:'M5 7c4-2 10-2 14 0v5c0 4-3 7-7 7s-7-3-7-7zM9 11h.01M15 11h.01M9 15c2 1 4 1 6 0',undercover:'M4 11h16M7 11l1-5h8l1 5M6 16a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M13 16a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M11 16h2',spyfall:'M12 21s-6-5.500-6-11a6 6 0 0 1 12 0c0 5.500-6 11-6 11zM12 10h.01',faker:'M5 5h14v10H11l-4 4v-4H5zM10 9a2 2 0 1 1 3 1.700c-.7.500-1 .800-1 1.500',psychiatrist:'M8 20v-3c-3-1-4-4-4-6a8 8 0 0 1 16 0c0 3-2 5-4 5v4M12 8v4M10 10h4',truthdare:'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z',wavelength:'M3 12c2-6 4-6 6 0s4 6 6 0 4-6 6 0M3 20h18',mind:'M6 7h8v12H6zM10 4h8v12',password:'M8 15a4 4 0 1 1 3-6.500L20 17v3h-3v-2h-2v-2h-2.500zM7 11h.01',contact:'M3 12h5M16 12h5M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0',mafia:'M3 13h18M6 13l1-7h10l1 7M5 13c0 4 3 7 7 7s7-3 7-7',telephone:'M4 20l1-5L16 4l4 4L9 19zM14 6l4 4',fishbowl:'M5 9h14M5 9c0 6 3 10 7 10s7-4 7-10M16 5c2 0 3 1 3 2',twenty:'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M10 9a2 2 0 1 1 3 1.700c-.7.500-1 .800-1 1.500M12 16h.01'};
const CC={'Social deduction':'#e8590c','Word':'#1c7ed6','Question':'#ae3ec9','Deduction':'#0ca678','Party':'#d6336c','Clue':'#f08c00','Co-op':'#2f9e44','Team':'#4263eb','Drawing':'#7048e8'};
const ic=(id,cl)=>`<svg class=gi viewBox="0 0 24 24" style="--c:${cl||'#e8590c'}"><path d="${IC[id]||''}"/></svg>`;
const A={me:ld('pg_me',{name:'',av:Math.random()*12|0}),be:null,code:null,room:null,pl:[],sec:{},host:null,view:'home',q:'',cat:'All',fav:ld('pg_fav',[]),hist:ld('pg_hist',[]),sound:ld('pg_snd',1),theme:ld('pg_theme','light'),modal:null,err:null,busy:false,lastHtml:'',lk:null,scored:null,pt:null};
let ac;const beep=(f=520,d=.07)=>{if(!A.sound)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.setValueAtTime(f*1.5,t);o.frequency.exponentialRampToValueAtTime(f,t+d*.7);g.gain.setValueAtTime(.035,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start();o.stop(t+d)}catch(e){}};
const uid=()=>A.be&&A.be.uid,G=()=>PG.games[A.room&&A.room.game],isHost=()=>A.room&&A.room.host==uid();
const ended=S=>['end','won','lost'].includes(S.ph)||(A.room.game=='fishbowl'&&S.ph=='res');
function cfgFull(g,c){const o={...(c||{})};(g.st||[]).forEach(x=>{if(x&&o[x.k]==null)o[x.k]=x.d});return o}
function ctx(){const S=(A.room&&A.room.state)||{},pl=S.pl||A.pl,ids=()=>pl.map(p=>p.id);return{S,me:A.sec,pid:uid(),host:isHost(),pl,cfg:cfgFull(G(),A.room.cfg),ids,on:()=>ids().filter(i=>!(S.off||{})[i]),name:i=>(pl.find(p=>p.id==i)||A.pl.find(p=>p.id==i)||{}).name||'?'}}
/* ---------- connection ---------- */
async function connect(){try{const cf=window.PG_CONFIG;A.be=cf&&cf.url&&window.supabase?SB:LB;await A.be.ready();const q=new URLSearchParams(location.search).get('join'),s=sessionStorage.pg_room;if(q&&A.me.name)await joinRoom(q.toUpperCase());else if(s&&A.me.name)await joinRoom(s,true);else if(q)A.pendingJoin=q.toUpperCase()}catch(e){A.err=e.message}render()}

async function joinRoom(code,quiet){if(!needName())return;try{A.busy=true;render();await A.be.join(code,A.me);await enter(code)}catch(e){if(!quiet)A.err=e.message||'Could not join';sessionStorage.removeItem('pg_room')}A.busy=false;render()}
const needName=()=>{if(A.me.name.trim())return true;A.err='Enter a nickname first';A.view='profile';render();return false};
async function enter(code){leaveLocal();A.code=code;sessionStorage.pg_room=code;A.view='room';A.unsub=A.be.sub(code,{room:onRoom,players:onPl,secret:s=>{A.sec=s;A.secv=(A.secv||0)+1;render()},action:a=>{A.host&&A.host.act(a)},gone:()=>{A.err='The room was closed';leaveLocal();render()},chat:onChat});
 A.hb=setInterval(()=>A.be.ping(code,{name:A.me.name,av:A.me.av,ready:A.ready}),4000);A.tk=setInterval(()=>{A.host&&A.host.tick()},1000);A.be.ping(code,{name:A.me.name,av:A.me.av});chatRender()}

function onRoom(r){const was=A.room;A.room=r; if(r.status=='lobby'){A.host=null;A.scored=null;A.lk=null}
 if(r.status=='play'&&isHost()&&!A.host){const sv=ld('pg_host_'+r.code,null),g=PG.games[r.game];if(sv&&sv.room==r.code&&sv.game==r.game&&sv.save&&r.state&&r.state.sc)startEngine(g,sv.pl,sv.save);else A.be.patch(r.code,{status:'lobby'})}
 if(r.status=='play'&&isHost()&&A.host&&ended(r.state||{})&&A.scored!=JSON.stringify(r.state.sc)){A.scored=JSON.stringify(r.state.sc);scoreRoom(r)}
 render()}

async function startGame(id){const g=PG.games[id||A.room.game],pl=A.pl.filter(p=>p.on||p.host);if(pl.length<Math.max(3,g.min)){A.err=`Needs at least ${Math.max(3,g.min)} players`;return render()}if(pl.length>g.max){A.err=`Up to ${g.max} players`;return render()}
 A.scored=null;A.lk=null;A.frozen=pl;await A.be.patch(A.code,{game:g.id,status:'play',state:{}});A.room.status='play';A.room.game=g.id;A.room.state={};A.host=new Host(g,pl,cfgFull(g,A.room.cfg),sink(A.code));render()}

 A.be.patch(A.code,{wins:w});if(r.party){let t=0;A.pt=setTimeout(()=>{const ids=Object.keys(PG.games),n=ids[(ids.indexOf(r.game)+1)%ids.length];A.be.patch(A.code,{game:n,status:'lobby',state:{}}).then(()=>setTimeout(()=>startGame(n),400))},12000)}}

 return`<section class="hero paper"><div><div class=row><input id=nick placeholder="Your nickname" value="${U.esc(A.me.name)}" maxlength=16 data-enter="ui:create"><button class="btn g" data-a="ui:create" ${A.busy?'disabled':''}>Create room</button></div><div class=row><input id=jc placeholder="Room code" maxlength=5 style="text-transform:uppercase" data-enter="ui:join"><button class=btn data-a="ui:join" ${A.busy?'disabled':''}>Join</button><button class="btn w" data-a="ui:random">Surprise me</button></div>${A.be&&A.be.name=='local'?'<p class=mut>Demo mode: open this page in several tabs of the same browser. Add your Supabase keys to play across devices.</p>':''}</div></section>
 <div class=bar><input id=sq placeholder="Search games" value="${U.esc(A.q)}"><div class=chips>${cats.map(c=>`<button class="chipb${A.cat==c?' on':''}" data-a="ui:cat" data-id="${c}">${c}</button>`).join('')}</div></div>
 <div class=grid>${gs.map(card).join('')||'<p class=empty>No games match. Try another search.</p>'}</div>`}
function lobby(){const r=A.room,g=G(),h0=isHost(),url=location.origin+location.pathname+'?join='+r.code,rdy=A.pl.find(p=>p.id==uid());
 const sets=(g.st||[]).map(s=>{const v=(r.cfg||{})[s.k]??s.d;return`<label>${s.l}${s.t=='num'?`<input type=number data-cfg="${s.k}" min=${s.min} max=${s.max} value="${v}">`:s.t=='bool'?`<input type=checkbox data-cfg="${s.k}" ${v?'checked':''}>`:`<select data-cfg="${s.k}">${s.o.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('')}</select>`}</label>`}).join('');
 return`<section class="paper lob"><div class=code><span class=mut>Room code</span><b>${r.code}</b><button class="btn w" data-a="ui:copy" data-id="${url}">Copy link</button><img class=qr alt="" onerror="this.remove()" src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${encodeURIComponent(url)}"></div>
 <h2>Players (${A.pl.length})</h2><ul class=plist>${A.pl.map(p=>`<li><i class="dot${p.on?' on':''}"></i>${av({pl:A.pl},p.id)}<span>${U.esc(p.name)}${p.host?' (host)':''}${p.id==uid()?' (you)':''}</span><em class="${p.ready?'ok':''}">${p.ready?'Ready':'Not ready'}</em></li>`).join('')}</ul>
 <div class=row><button class="btn ${rdy&&rdy.ready?'r':'g'}" data-a="ui:ready">${rdy&&rdy.ready?'Not ready':'I\u2019m ready'}</button><button class="btn w" data-a="ui:leave">Leave room</button></div></section>
 <section class="paper lob"><h2>${h0?'Choose a game':'Selected game'}</h2><div class="gsel">${Object.values(PG.games).filter(x=>h0||x.id==g.id).map(x=>`<button class="gchip${x.id==g.id?' on':''}" ${h0?`data-a="ui:pick" data-id="${x.id}"`:''}>${ic(x.id,CC[x.cat[0]])}<span>${x.name}</span></button>`).join('')}</div>
 <div class=rules><h3>${g.name}: how to play</h3>${g.rules.split('\n').map((l,i)=>`<p><b>${i+1}.</b> ${U.esc(l)}</p>`).join('')}<p class=mut>${g.min}\u2013${g.max} players \u00b7 about ${g.time}</p></div>
 ${h0?`<div class=sets>${sets}<label>Custom words (one per line)<textarea data-cfg="custom" rows=3 placeholder="Used by word games when the list is set to Custom">${U.esc((r.cfg||{}).custom||'')}</textarea></label><label class=inl>Party mode (rotate games automatically)<input type=checkbox data-party ${r.party?'checked':''}></label></div><div class=row><button class="btn g" data-a="ui:start">Start game</button><button class="btn w" data-a="ui:pickrand">Random game</button></div>`:`<p class=mut>The host chooses the game and settings.</p>`}</section>
 <section class="paper lob"><h2>Room wins</h2>${Object.keys(r.wins||{}).length?`<ol class=lb>${Object.entries(r.wins).sort((a,b)=>b[1]-a[1]).map(([i,n])=>`<li>${av({pl:A.pl},i)}<span>${U.esc((A.pl.find(p=>p.id==i)||{}).name||'Player')}</span><b>${n}</b></li>`).join('')}</ol>`:'<p class=empty>Wins across games are tracked here.</p>'}</section>`}
function game(){const r=A.room,g=G(),c=ctx(),S=c.S;rec();if(!S.sc)return`<section class="paper play"><h2>${g.name}</h2><p class=mut>Setting up the round\u2026</p><div class=loadbar><i></i></div>${isHost()?'':''}</section>`;
 let body;try{body=g.view(c)}catch(e){body=`<p class=err>Something went wrong showing this screen.</p>`;console.error(e)}
 const ended0=ended(S);return`<section class="paper play"><header class=ph><div class=gic style="background:${CC[g.cat[0]]}">${ic(g.id,'#fff')}</div><h2>${g.name}</h2><button class="btn w sm" data-a="ui:rules">Rules</button>${c.host?`<button class="btn r sm" data-a="ui:endgame">End game</button>`:''}</header>${S.off&&Object.values(S.off).some(Boolean)?`<p class=mut>Disconnected: ${c.ids().filter(i=>S.off[i]).map(i=>U.esc(c.name(i))).join(', ')}</p>`:''}<div class=body>${body}</div>${ended0&&r.party?'<p class=chip>Party mode: next game starts soon\u2026</p>':''}</section>`}
function profile(){const a=A.me;return`<section class="paper lob"><h2>Your profile</h2><label>Nickname<input id=pn value="${U.esc(a.name)}" maxlength=16></label><p>Avatar colour</p><div class=sw>${AVC.map((c,i)=>`<button class="swb${a.av==i?' on':''}" style="background:${c}" data-a="ui:av" data-id="${i}">${U.esc((a.name||'?')[0].toUpperCase())}</button>`).join('')}</div><div class=row><button class="btn g" data-a="ui:saveprof">Save</button></div></section>`}
function stats(){const h=A.hist,by={};h.forEach(x=>{(by[x.g]=by[x.g]||{p:0,w:0}).p++;if(x.won)by[x.g].w++});return`<section class="paper lob"><h2>Your statistics</h2><div class=kpis><div><b>${h.length}</b><span>Games played</span></div><div><b>${h.filter(x=>x.won).length}</b><span>Wins</span></div><div><b>${A.fav.length}</b><span>Favourites</span></div></div>${Object.keys(by).length?`<ul class=plist>${Object.entries(by).map(([g,x])=>`<li>${ic(g,CC[PG.games[g].cat[0]])}<span>${PG.games[g].name}</span><em>${x.w}/${x.p} wins</em></li>`).join('')}</ul>`:'<p class=empty>Play a game and your history shows up here.</p>'}</section>
 <section class="paper lob"><h2>Recent games</h2>${h.slice(0,12).map(x=>`<p class=hrow>${PG.games[x.g]?PG.games[x.g].name:x.g} \u00b7 ${x.won?'won':'played'} \u00b7 ${x.sc} pts \u00b7 ${new Date(x.t).toLocaleDateString()}</p>`).join('')||'<p class=empty>Nothing yet.</p>'}</section>`}
function modal(){const g=PG.games[A.modal];if(!g)return'';return`<div class=ov data-bd=1><div class="paper md"><button class=xb data-a="ui:close" title="Close"></button><div class=gic style="background:${CC[g.cat[0]]}">${ic(g.id,'#fff')}</div><h2>${g.name}</h2>${g.rules.split('\n').map((l,i)=>`<p><b>${i+1}.</b> ${U.esc(l)}</p>`).join('')}<p class=mut>${g.min}\u2013${g.max} players \u00b7 about ${g.time}</p><div class=row>${A.room&&isHost()?`<button class="btn g" data-a="ui:pick" data-id="${g.id}">Use in this room</button>`:A.room?'':`<button class="btn g" data-a="ui:host" data-id="${g.id}">Host this game</button>`}<button class="btn w" data-a="ui:fav" data-id="${g.id}">${stars(g.id)?'Remove favourite':'Add favourite'}</button></div></div></div>`}
function render(){if(window.PDOWN){A._pend=1;return}const root=$('#app');if(!root||!A.be&&!A.err)return;document.documentElement.dataset.theme=A.theme;const ae=document.activeElement;let keep=null;if(ae&&root.contains(ae)&&ae.id&&/INPUT|TEXTAREA/.test(ae.tagName))keep={id:ae.id,v:ae.value,s:ae.selectionStart};
 if(A.room&&A.room.status=='play'&&A.view=='room'&&G()&&G().live&&A.room.state&&A.room.state.sc){const k=G().key(ctx())+'|'+(A.secv||0);if(k===A.lk&&!A.err)return;A.lk=k}
 const inroom=A.view=='room'&&A.room,pg=inroom?(A.room.status=='play'?game():lobby()):A.view=='profile'?profile():A.view=='stats'?stats():home();
 const html=`<nav class="top paper"><b class=logo>Party Hub</b><div class=nv>${['home:Games','profile:Profile','stats:Stats'].map(x=>{const[k,l]=x.split(':');return`<button class="${A.view==k||(k=='home'&&inroom&&A.view=='room')?'on':''}" data-a="ui:nav" data-id="${k}">${l}</button>`}).join('')}${inroom?`<button class="${A.view=='room'?'on':''}" data-a="ui:nav" data-id="room">Room ${A.room.code}</button>`:''}</div><div class=tools><button class="ib mu${A.music?'':' off'}" data-a="ui:mus" title="Music ${A.music?'on':'off'}" aria-label="Music ${A.music?'on':'off'}"></button><button class="ib sn${A.sound?'':' off'}" data-a="ui:snd" title="Sound effects ${A.sound?'on':'off'}" aria-label="Sound effects ${A.sound?'on':'off'}"></button><button class="ib th ${A.theme=='dark'?'sun':'moon'}" data-a="ui:theme" title="${A.theme=='dark'?'Switch to light theme':'Switch to dark theme'}" aria-label="${A.theme=='dark'?'Switch to light theme':'Switch to dark theme'}"></button></div></nav>${A.err?`<div class=toast data-a="ui:clr">${U.esc(A.err)}</div>`:''}<main>${A.busy?'<div class=loadbar><i></i></div>':''}${pg}</main>${modal()}`;
 if(html===A.lastHtml)return;A.lastHtml=html;root.innerHTML=html;if(keep){const e=document.getElementById(keep.id);if(e){e.value=keep.v;e.focus();try{e.setSelectionRange(keep.s,keep.s)}catch(x){}}}initCanvas();timers();wake()}
function timers(){document.querySelectorAll('[data-dl]').forEach(e=>{const s=Math.max(0,Math.round((+e.dataset.dl-Date.now())/1000));e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');e.classList.toggle('low',s<=10)})}
setInterval(timers,500);
function initCanvas(){const cv=$('#cv');if(!cv)return;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,300,200);x.lineWidth=3;x.lineCap='round';x.strokeStyle='#222';let d=0;const p=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*300/r.width,(e.clientY-r.top)*200/r.height]};cv.onpointerdown=e=>{d=1;cv.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b);x.stroke()};cv.onpointermove=e=>{if(!d)return;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};cv.onpointerup=()=>d=0}

document.addEventListener('pointerup',e=>{const d=PD;PD=null;if(d&&!d.b.isConnected&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<14){const el=document.elementFromPoint(e.clientX,e.clientY),b=el&&el.closest('[data-a]');if(b&&b.dataset.a===d.a&&b.dataset.id===d.id)setTimeout(()=>b.click(),0)}pdDone()},true);

function musSync(){if(A.music&&!document.hidden)MUS.play().catch(()=>{});else MUS.pause()}
document.addEventListener('visibilitychange',()=>{musSync();if(!document.hidden)wake()});
function wake(){if(A.room&&navigator.wakeLock&&!A._wl&&!document.hidden){A._wl=1;navigator.wakeLock.request('screen').then(l=>{A._wl=l;l.addEventListener('release',()=>A._wl=null)}).catch(()=>{A._wl=null})}}
/* ---------- events ---------- */
const UI={
 nav:b=>{A.view=b.dataset.id;A.err=null},
 create:()=>{A.me.name=($('#nick')||{}).value||A.me.name;st('pg_me',A.me);create()},
 join:()=>{A.me.name=($('#nick')||{}).value||A.me.name;st('pg_me',A.me);const c=(($('#jc')||{}).value||'').trim().toUpperCase();if(c)joinRoom(c);else{A.err='Enter a room code';render()}},
 random:()=>{const g=U.rnd(Object.values(PG.games));A.modal=g.id},
 game:b=>{A.modal=b.dataset.id},close:()=>{A.modal=null},rules:()=>{A.modal=A.room.game},
 fav:b=>{const i=b.dataset.id;A.fav=A.fav.includes(i)?A.fav.filter(x=>x!=i):[...A.fav,i];st('pg_fav',A.fav)},
 cat:b=>{A.cat=b.dataset.id},host:b=>{A.modal=null;if(!A.me.name.trim()){A.view='profile';A.err='Choose a nickname first';return render()}create(b.dataset.id)},
 pick:b=>{A.modal=null;A.be.patch(A.code,{game:b.dataset.id,cfg:{}});A.room.game=b.dataset.id;A.room.cfg={}},
 pickrand:()=>UI.pick({dataset:{id:U.rnd(Object.keys(PG.games))}}),
 start:()=>startGame(),ready:()=>{A.ready=!A.ready;const p=A.pl.find(x=>x.id==uid());if(p)p.ready=A.ready;A.be.ping(A.code,{ready:A.ready,name:A.me.name,av:A.me.av})},
 leave:()=>leave(),copy:b=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.id);A.err='Link copied';setTimeout(()=>{A.err=null;render()},1200)},
 endgame:()=>{if(confirm('End the game and return everyone to the lobby?'))backLobby()},
 snd:()=>{A.sound=A.sound?0:1;st('pg_snd',A.sound)},theme:()=>{A.theme=A.theme=='dark'?'light':'dark';st('pg_theme',A.theme)},
 av:b=>{A.me.av=+b.dataset.id;st('pg_me',A.me)},saveprof:()=>{const n=($('#pn')||{}).value.trim();if(!n){A.err='Nickname required';return}A.me.name=n;st('pg_me',A.me);A.err=null;A.view=A.room?'room':'home';if(A.room)A.be.ping(A.code,{name:n,av:A.me.av});if(A.pendingJoin){const c=A.pendingJoin;A.pendingJoin=null;joinRoom(c)}},
 clr:()=>{A.err=null},mus:()=>{A.music=A.music?0:1;st('pg_mus',A.music);musSync()}};
document.addEventListener('click',e=>{if(e.target.closest('#chat'))return;if(e.target.dataset&&e.target.dataset.bd){A.modal=null;render();return}const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a;beep();navigator.vibrate&&navigator.vibrate(8);if(a=='lobby'){backLobby();return}
 if(a.startsWith('ui:')){UI[a.slice(3)]&&UI[a.slice(3)](b);render();return}
 const d={...b.dataset};delete d.a;if(d.in){const el=document.getElementById(d.in);d.v=el&&el.tagName=='CANVAS'?el.toDataURL('image/jpeg',.5):el?el.value:'';if(el&&el.tagName=='INPUT'){if(!d.v.trim())return;el.value=''}delete d.in}
 if(d.in2){const el=document.getElementById(d.in2);d.v2=el?el.value:'';if(el)el.value='';delete d.in2}
 if(a=='clr'){initCanvas();return}
 A.be.act(A.code,{p:uid(),t:a,...d,i:Math.random()})});
document.addEventListener('keydown',e=>{if(e.key!='Enter'||!e.target.dataset||!e.target.dataset.enter||e.target.closest('#chat'))return;const b=e.target.parentNode.querySelector('button[data-a]');b&&b.click()});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='sq'){A.q=t.value;render()}if(t.dataset.cfg!=null&&A.room){const v=t.type=='checkbox'?t.checked:t.type=='number'?+t.value:t.value;A.room.cfg={...(A.room.cfg||{}),[t.dataset.cfg]:v};cfgSave()}if(t.dataset.party!=null&&A.room){A.room.party=t.checked;A.be.patch(A.code,{party:t.checked})}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.a=='guess'&&t.dataset.live){A.be.act(A.code,{p:uid(),t:'guess',v:t.value,i:Math.random()})}if(t.dataset.cfg!=null&&A.room){const v=t.type=='checkbox'?t.checked:t.type=='number'?+t.value:t.value;A.room.cfg={...(A.room.cfg||{}),[t.dataset.cfg]:v};cfgSave()}});
document.addEventListener('DOMContentLoaded',()=>{document.documentElement.dataset.theme=A.theme;connect()});

/* ---------- chat zone: lives outside #app so new messages never re-render (or reset) the game screen ---------- */
A.chat=[];A.cids=new Set();A.unread=0;A.chatOpen=ld('pg_chat',(typeof innerWidth!='undefined'?innerWidth:1200)>=1100);
function onChat(m){if(A.cids.has(m.id))return;A.cids.add(m.id);A.chat.push(m);A.chat=A.chat.slice(-100);if(!A.chatOpen&&m.p!=uid())A.unread++;if(m.p!=uid()&&A.chatOpen)beep(760,.05);chatRender()}
function chatRender(){const box=document.getElementById('chat');if(!box)return;if(!A.room){box.innerHTML='';document.body.classList.remove('chat-open');return}
 document.body.classList.toggle('chat-open',A.chatOpen);if(!box.firstChild){box.innerHTML='<button class="chatbtn btn" id=chatbtn>Chat <b id=cu></b></button><section class="chatbox paper" id=chatbox><header><b>Room chat</b><button class=xb id=chatx title="Close chat"></button></header><div id=msgs></div><div class=crow><input id=cin maxlength=200 placeholder="Message the room" autocomplete=off><button class="btn g sm" id=csend>Send</button></div></section>'}
 box.classList.toggle('open',A.chatOpen);const me=uid(),ms=document.getElementById('msgs');
 ms.innerHTML=A.chat.map(m=>`<div class="msg${m.p==me?' me':''}"><span>${m.p==me?'You':U.esc(m.name)}</span>${U.esc(m.text)}</div>`).join('')||'<p class=mut>No messages yet. Say hi!</p>';ms.scrollTop=ms.scrollHeight;
 const cu=document.getElementById('cu');cu.textContent=A.unread?A.unread:'';cu.hidden=!A.unread}
function chatSend(){const i=document.getElementById('cin'),t=i.value.trim().slice(0,200);if(!t||!A.room)return;i.value='';A.be.chat(A.code,{name:A.me.name,text:t});beep(640,.04)}
document.addEventListener('click',e=>{const t=e.target;if(!t.closest||!t.closest('#chat'))return;if(t.closest('#chatbtn')||t.closest('#chatx')){A.chatOpen=!A.chatOpen;st('pg_chat',A.chatOpen);if(A.chatOpen)A.unread=0;chatRender();if(A.chatOpen){const i=document.getElementById('cin');i&&i.focus()}}else if(t.closest('#csend'))chatSend()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='cin')chatSend()});
</script>
